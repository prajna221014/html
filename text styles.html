<!DOCTYPE html>
<html>
<head>
  <title>my superhero card</title> 
  
  <style>

  body {
     background-image: linear-gradient(to bottom, rgb(148, 148, 227), rgb(117, 255, 117), rgb(251, 251, 157));
     background-repeat: no-repeat;
     color: rgb(175, 234, 175);
     font-family: cursive;
  }

  .hero-name {
  font-family: Arial, sans-serif;
  font-size: 60px;
  font-weight: bold;
  color: rgb(117, 173, 115);
  font-style: italic;
  text-shadow: 8px 3px rgb(23, 66, 26);
}

.tagline {
   font-style: italic;
   color: rgb(31, 74, 36);
   text-transform: capitalize;
}

.lable {
   text-transform: uppercase;
   text-decoration: underline;
   color: rgb(12, 63, 12);
}

.power {
   font-weight: bold;
   color: rgb(35, 133, 35);
}

.weakness {
   text-decoration: dotted;
   color: rgb(43, 126, 43);
}

.badge {
   font-size: 28px;
   font-weight: bold;
   color: rgb(14, 60, 14);
   transform: rotate(15deg);
}

.made-by {
   color: mediumseagreen;
   font-style: italic;
}

</style>
</head>

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4NXQgcsBV3lxgK68ajVrLT0Igvz5R6mYOqm77hrb8nA&s=10"
            alt="the dragon" width="350" height="350">

   <h1 class="hero-name">dragon slayer</h1>
   <p class="tagline">the most powerful hero on planet earth</p>

   <h2 class="lable">Super power</h2>
   <p class="power">can run faster than any land or sea animal in the world</p>
   <p class="power">super strog and can lift mountains on his pinky!</p>

   <h2 class="lable">weaknesses</h2>
   <p class="weakness">bananas and oranges</p>
   <p class="weakness">homework</p>
<br>

   <p class="badge">top hero</p>

   <p class="made-by">created by prajna</p>

</body>
</html>
